<svg width="100%" height="150" viewBox="0 0 1440 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color: #FFC0CB; stop-opacity: 1" /> <stop offset="100%" style="stop-color: #DB7093; stop-opacity: 1" /> </linearGradient>

    <path id="wave-path" d="M 0 64 Q 240 20, 480 64 T 960 64 T 1440 64 T 1920 64 T 2400 64 T 2880 64 V 150 H 0 Z" />
  </defs>
  
  <g>
    <use xlink:href="#wave-path" x="0" y="0" fill="url(#wave-gradient)" opacity="0.6">
      <animate
        attributeName="x"
        from="0"
        to="-960"
        dur="12s"
        repeatCount="indefinite"
      />
    </use>
    
    <use xlink:href="#wave-path" x="0" y="5" fill="url(#wave-gradient)" opacity="1">
      <animate
        attributeName="x"
        from="0"
        to="-960"
        dur="8s"
        repeatCount="indefinite"
      />
    </use>
  </g>
</svg>