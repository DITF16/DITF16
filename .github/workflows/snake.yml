name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # 每天运行一次
  workflow_dispatch:      # 允许手动运行

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成战斗数据 (强力模式)
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # 必填项
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # 直接输出到 dist 目录，不搞搬运了
          filename: dist/github-stats.svg
          
          # 基础配置
          base: header, repositories
          template: classic
          config_timezone: Asia/Shanghai
          
          # 关键配置：不让它自己提交，但强制验证文件完整性
          output_action: none
          verify: yes
          debug: yes

      # 3. 检查文件是否存在 (这次应该能看到了)
      - name: Check files
        run: |
          echo "Listing dist directory:"
          ls -l dist/
          if [ ! -f "dist/github-stats.svg" ]; then
            echo "❌ 依然失败: dist/github-stats.svg 不存在"
            exit 1
          else
            echo "✅ 成功: 文件已生成！"
          fi

      # 4. 推送 dist 目录下的所有文件
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
