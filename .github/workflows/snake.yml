name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # 每天运行一次
  workflow_dispatch:      # 允许手动运行

# ❌ 注意：这里删除了 permissions 代码块，直接使用仓库默认的读写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成战斗数据
      # 因为去掉了权限限制，现在它应该能读取到你的数据了！
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-stats.svg 
          base: header, repositories
          template: classic
          config_timezone: Asia/Shanghai
          output_action: none

      # 3. 搬运文件 + 最终检查
      - name: Move Metrics to dist
        run: |
          # 检查文件是否生成，如果没生成，打印一下当前目录方便调试
          if [ -f "github-stats.svg" ]; then
            mv github-stats.svg dist/
            echo "✅ 成功: 战斗数据已生成并移动！"
          else
            echo "❌ 失败: github-stats.svg 依然没有生成。"
            echo "可能是因为网络波动，或者Token权限在Settings里没有正确保存。"
            exit 1
          fi

      # 4. 推送文件
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
