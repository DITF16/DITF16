name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # 每天运行一次
  workflow_dispatch:      # 允许手动运行

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: DITF16
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成战斗数据 (替代原来的下载方案)
      # 使用 metrics 插件本地计算，不依赖 Vercel
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # 你的 GitHub Token (系统自带，无需配置)
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # 输出文件路径
          filename: dist/github-stats.svg
          
          # 只要基础信息(头部信息+仓库信息)
          base: header, repositories
          
          # 主题：使用 dracula (暗色吸血鬼主题，很适合赛博风)
          # 你也可以换成: night, tokyonight, dark
          theme: tokyonight
          
          # 设置时区
          config_timezone: Asia/Shanghai
          
          # 关键：告诉插件不要自己提交，只生成文件，让最后一步统一提交
          output_action: none

      # 3. 将 dist 目录下的所有图片(蛇+战斗数据)推送到 output 分支
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
