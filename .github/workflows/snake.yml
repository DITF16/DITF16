name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # 每天运行一次
  workflow_dispatch:      # 允许手动运行

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: DITF16
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成战斗数据 (修复版：去掉了错误的 theme 参数)
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: DITF16              # 明确指定用户名
          filename: github-stats.svg # 直接生成在根目录
          base: header, repositories # 只展示头部和仓库数据
          template: classic          # 使用经典模板
          config_timezone: Asia/Shanghai
          output_action: none        # 不让它自己提交，我们手动提交

      # 3. 搬运文件
      - name: Move Metrics to dist
        run: |
          if [ -f "github-stats.svg" ]; then
            mv github-stats.svg dist/
            echo "✅ 成功移动 github-stats.svg 到 dist 目录"
          else
            echo "❌ 严重错误: github-stats.svg 没有生成！"
            ls -R 
            exit 1
          fi

      # 4. 推送文件
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
