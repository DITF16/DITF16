name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # 每天运行一次
  workflow_dispatch:      # 允许手动运行

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: DITF16
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 下载战斗数据卡片 (这里就是新增的魔法！)
      # 我们让机器人用 curl 命令把 Vercel 的图下载并保存为 github-stats.svg
      - name: Download GitHub Stats
        run: |
          curl -L -o dist/github-stats.svg "https://github-readme-stats.vercel.app/api?username=DITF16&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=F75C7E&icon_color=4facfe"

      # 3. 将 dist 目录下的所有图片推送到 output 分支
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
