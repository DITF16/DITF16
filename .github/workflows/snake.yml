name: Generate All Stats (Snake, City, Langs)

on:
  schedule:
    - cron: "0 0 * * *" # 每天运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate All Images
    steps:
      - uses: actions/checkout@v3

      # ✅ 关键修复步骤：先由 Runner 手动创建 dist 目录
      # 这样目录的所有者是当前用户，而不是 Docker 的 root 用户
      # 后续的搬运操作（cp）就不会报 Permission denied 了
      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成 3D 霓虹城市 (env 配置法)
      - name: Generate 3D Contribution Profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. 生成语言统计卡片 (生成到临时文件夹)
      - name: Generate Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      # 4. 搬运所有图片到 dist 目录
      # 因为 dist 是我们自己创建的，所以现在有权限写入了！
      - name: Move images to dist
        run: |
          # 搬运 3D 城市图
          cp -r profile-3d-contrib/* dist/
          
          # 搬运语言统计图 (2077主题)
          cp profile-summary-card-output/2077/2-most-commit-language.svg dist/language-stats.svg
          
          echo "✅ 所有图片搬运完毕，权限检查通过！"

      # 5. 推送到 output 分支
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
