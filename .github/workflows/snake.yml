name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇 (蛇不需要特殊权限，用默认的就行)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成战斗数据 (使用 METRICS_TOKEN)
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # 👇 关键修改：这里换成了我们新加的 METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          
          # 仍然强制输出到 dist
          filename: dist/github-stats.svg
          
          # 配置
          user: DITF16
          base: header, repositories
          template: classic
          config_timezone: Asia/Shanghai
          
          # 开启 debug 确保我们能看到日志
          debug: yes
          verify: no  # 暂时关掉验证，防止误报
          output_action: none

      # 3. 检查文件 (这次应该有了！)
      - name: Check files
        run: |
          ls -l dist/
          if [ -f "dist/github-stats.svg" ]; then
            echo "✅ 欧耶！战斗数据生成成功！"
          else
            echo "❌ 还是没有... 请检查 Token 权限。"
            exit 1
          fi

      # 4. 推送
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          # 推送还是用默认 Token 比较安全
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
