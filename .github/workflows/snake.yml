name: Generate 3D City & Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contrib & Snake
    steps:
      - uses: actions/checkout@v3

      # ✅ 【新增步骤】先创建 dist 目录，确保当前用户拥有写入权限
      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成 3D 霓虹城市
      - name: Generate 3D Contribution Profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. 搬运文件
      - name: Move 3D images to dist
        # 这里的 mkdir -p dist 其实可以保留，但因为上面已经创建了，这里主要是执行 cp
        run: |
          cp -r profile-3d-contrib/* dist/
          echo "✅ 3D 城市生成完毕！"

      # 4. 推送到 output 分支
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
