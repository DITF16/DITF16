name: Generate 3D City & Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contrib & Snake
    steps:
      - uses: actions/checkout@v3

      # 1. 生成贪吃蛇 (这个用 with，没问题)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成 3D 霓虹城市 (修正点：改成 env 写法)
      - name: Generate 3D Contribution Profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # 👇 这里的 GITHUB_TOKEN 必须写在 env 下面！
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. 搬运文件
      - name: Move 3D images to dist
        run: |
          mkdir -p dist
          # 3D插件生成的图片在 profile-3d-contrib 文件夹里，我们要搬出来
          cp -r profile-3d-contrib/* dist/
          echo "✅ 3D 城市生成完毕！"

      # 4. 推送到 output 分支
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
