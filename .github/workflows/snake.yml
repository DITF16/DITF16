name: Generate 3D City & Snake

on:
  schedule:
    - cron: "0 0 * * *" # 每天运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contrib & Snake
    steps:
      - uses: actions/checkout@v3

      # 1. 生成贪吃蛇 (你原来的那个，保留它)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成 3D 霓虹城市 (新装备！)
      # 不需要任何特殊 Token，直接用系统自带的
      - name: Generate 3D Contribution Profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        with:
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json # 使用默认配置

      # 3. 搬运文件到 dist 目录 (方便统一管理)
      - name: Move 3D images to dist
        run: |
          mkdir -p dist
          # 3D插件默认生成在 profile-3d-contrib 文件夹里，我们把它搬出来
          cp -r profile-3d-contrib/* dist/
          echo "✅ 3D 城市生成完毕！"

      # 4. 推送到 output 分支
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
