name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist directory
        run: mkdir -p dist

      # 1. 生成贪吃蛇
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. 生成战斗数据 (修正点：路径改回根目录)
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # 必须使用你在 Secrets 里配好的万能钥匙
          token: ${{ secrets.METRICS_TOKEN }}
          
          # 👇👇👇 关键修改：去掉 dist/ 前缀！直接生成在当前目录 👇👇👇
          filename: github-stats.svg
          
          user: DITF16
          base: header, repositories
          template: classic
          config_timezone: Asia/Shanghai
          output_action: none
          verify: no
          debug: yes

      # 3. 手动搬运 (我们自己动手，丰衣足食)
      - name: Move to dist
        run: |
          echo "正在检查根目录文件..."
          ls -l github-stats.svg || echo "⚠️ 根目录也没找到文件"
          
          if [ -f "github-stats.svg" ]; then
            mv github-stats.svg dist/
            echo "✅ 成功！文件已生成并移动到 dist 目录！"
          else
            echo "❌ 依然失败。请检查 Token 是否包含换行符或空格。"
            exit 1
          fi

      # 4. 推送
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
