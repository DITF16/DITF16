name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *"  # 每天运行一次
  workflow_dispatch:      # 允许手动运行

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 1. 创建存放图片的目录
      - name: Create dist directory
        run: mkdir -p dist

      # 2. 生成贪吃蛇 (这个通常没问题，直接输出到 dist)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: DITF16
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. 生成战斗数据 (修改策略：先生成在根目录)
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # ⚠️ 修改点：去掉路径前缀，直接生成在根目录，防止路径错误
          filename: github-stats.svg
          
          base: header, repositories
          theme: tokyonight
          config_timezone: Asia/Shanghai
          output_action: none

      # 4. 关键步骤：把生成的战斗数据搬运到 dist 目录
      # 顺便检查一下文件到底生成了没，如果没有会打印错误
      - name: Move Metrics to dist
        run: |
          if [ -f "github-stats.svg" ]; then
            mv github-stats.svg dist/
            echo "✅ 成功移动 github-stats.svg 到 dist 目录"
          else
            echo "❌ 严重错误: github-stats.svg 没有生成！"
            ls -R  # 列出当前所有文件帮我们找原因
            exit 1
          fi

      # 5. 推送 dist 目录下的所有文件
      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
